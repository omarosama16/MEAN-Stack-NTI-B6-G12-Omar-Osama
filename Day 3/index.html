    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #040303;
        color: white;
        min-height: 100vh;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    #mainTitle {
        font-size: 3rem;
        color: #00d4ff;
        margin-bottom: 10px;
        text-shadow: 0 0 10px rgba(0, 212, 255, 0.4);
    }

    p {
        font-size: 1.2rem;
        margin: 10px 0;
    }

    .finalReport {
        margin-top: 30px;
        padding: 25px 35px;
        width: 420px;
        max-width: 90%;

        background: #1b1b1b;
        border: 2px solid #00d4ff;
        border-radius: 12px;

        color: white;
        text-align: left;
        font-size: 18px;
        line-height: 1.8;

        box-shadow: 0 8px 20px rgba(0, 212, 255, 0.2);
        transition: 0.3s;
    }

    .finalReport:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 25px rgba(0, 212, 255, 0.35);
    }
    </style>
    </head>
    <body>
    <h1 id="mainTitle">Welcome</h1>
    <p>Day 3 NTI MEAN stack </p>
    <p id="Final Report">...</p>
    <script src="script.js"></script>
    </body>
    </html>
