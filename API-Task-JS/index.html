<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Posts</h1>

   
        <form id="postForm">

            <input
                type="text"
                id="title"
                placeholder="Post title"
                required
            >

            <textarea
                id="body"
                placeholder="Post body"
                required
            ></textarea>

            <button type="submit">
                Add Post
            </button>

        </form>



        <button id="getBtn">
            Get Posts
        </button>


  
        <div id="posts"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
